# Lefthook Git Hooks Configuration
# https://github.com/evilmartians/lefthook

commit-msg:
  commands:
    commitlint:
      run: npx --no -- @commitlint/cli --edit {1}

pre-commit:
  parallel: true
  commands:
    lint-staged:
      run: npx lint-staged
    typecheck:
      run: pnpm typecheck

pre-push:
  parallel: false
  commands:
    tests:
      run: pnpm test
