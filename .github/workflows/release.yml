name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_fail || false }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: romanager-sync-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: romanager-sync-linux-aarch64
            allow_fail: true
          - os: macos-13
            asset: romanager-sync-darwin-x86_64
          - os: macos-latest
            asset: romanager-sync-darwin-aarch64
          - os: windows-latest
            asset: romanager-sync-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile CLI Binary
        env:
          OUTPUT_NAME: ${{ matrix.asset }}
        run: pnpm run build:cli

      - name: Generate Checksum
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"), crypto = require("node:crypto"); const file = "apps/cli/dist/${{ matrix.asset }}"; const buf = fs.readFileSync(file); const hash = crypto.createHash("sha256").update(buf).digest("hex"); fs.writeFileSync(file + ".sha256", hash + "  ${{ matrix.asset }}\n");'

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset }}
          path: |
            apps/cli/dist/${{ matrix.asset }}
            apps/cli/dist/${{ matrix.asset }}.sha256
          retention-days: 1

  publish-docker:
    name: Build & Publish Multi-Arch Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [build-cli, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      - name: Combine Checksums
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: release-assets/*
          generate_release_notes: true
