name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.asset }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: romanager-sync-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            asset: romanager-sync-linux-aarch64
          - target: x86_64-apple-darwin
            asset: romanager-sync-darwin-x86_64
          - target: aarch64-apple-darwin
            asset: romanager-sync-darwin-aarch64
          - target: x86_64-pc-windows-msvc
            asset: romanager-sync-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile CLI Binary
        run: |
          mkdir -p dist
          deno compile --allow-read --allow-write --allow-net --allow-env --allow-sys \
            --target ${{ matrix.target }} \
            --output dist/${{ matrix.asset }} \
            apps/cli/src/main.ts

      - name: Generate Checksum
        run: |
          cd dist
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset }}
          path: dist/*
          retention-days: 1

  publish-docker:
    name: Build & Publish Multi-Arch Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [build-cli, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      - name: Combine Checksums
        run: |
          cd release-assets
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: release-assets/*
          generate_release_notes: true
